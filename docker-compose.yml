# One container per component. Start the cluster with:
#   docker compose up -d --build
# then open a client shell with:
#   docker compose run --rm client
services:
  nameserver:
    build: .
    command: nameserver

  chunkserver1:
    build: .
    command: chunkserver --name chunk1
    environment:
      NAMESERVER_HOST: nameserver
      ADVERTISE_HOST: chunkserver1
      CHUNK_CLIENT_PORT: "9000"
    depends_on: [nameserver]

  chunkserver2:
    build: .
    command: chunkserver --name chunk2
    environment:
      NAMESERVER_HOST: nameserver
      ADVERTISE_HOST: chunkserver2
      CHUNK_CLIENT_PORT: "9000"
    depends_on: [nameserver]

  chunkserver3:
    build: .
    command: chunkserver --name chunk3
    environment:
      NAMESERVER_HOST: nameserver
      ADVERTISE_HOST: chunkserver3
      CHUNK_CLIENT_PORT: "9000"
    depends_on: [nameserver]

  chunkserver4:
    build: .
    command: chunkserver --name chunk4
    environment:
      NAMESERVER_HOST: nameserver
      ADVERTISE_HOST: chunkserver4
      CHUNK_CLIENT_PORT: "9000"
    depends_on: [nameserver]

  client:
    build: .
    command: client --name shrek
    profiles: [client]
    stdin_open: true
    tty: true
    environment:
      NAMESERVER_HOST: nameserver
    volumes:
      - ./files:/files:ro
    depends_on: [nameserver, chunkserver1, chunkserver2, chunkserver3, chunkserver4]
